---
name: Bump tomcat versions

on:
  pull_request:
    paths:
      - .github/workflows/bumpVersions.yml
      - updatecli.d/**
      - get-checksum.sh
  workflow_dispatch:
  schedule:
    - cron:  '0 6 * * MON'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  updatecli:
    name: Tomcat ${{ matrix.tomcat_major }} version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - tomcat_major: 11
            tcnative_source_pattern: 2
            apr_source_pattern: 1
          - tomcat_major: 10
            tcnative_source_pattern: 2
            apr_source_pattern: 1
          - tomcat_major: 9
            tcnative_source_pattern: 2
            apr_source_pattern: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.21.3

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049

      - name: Install htmlq
        run: |
          brew install htmlq

      - name: Set required environment variables
        run: |
          echo "TOMCAT_MAJOR=${{ matrix.tomcat_major }}" >> $GITHUB_ENV
          echo "TCNATIVE_SOURCE_PATTERN=${{ matrix.tcnative_source_pattern }}" >> $GITHUB_ENV
          echo "APR_SOURCE_PATTERN=${{ matrix.apr_source_pattern }}" >> $GITHUB_ENV

      - name: Save current versions
        id: current
        run: |
          versions_file=tomcat${{ matrix.tomcat_major }}.json
          echo "tomcat=$(jq -r '.tomcat_version' $versions_file)" >> $GITHUB_OUTPUT
          echo "tcnative=$(jq -r '.tcnative_version' $versions_file)" >> $GITHUB_OUTPUT
          echo "apr=$(jq -r '.apr_version' $versions_file)" >> $GITHUB_OUTPUT

      - name: Run updatecli
        run: |
          updatecli apply

      - name: Save updated versions
        id: updated
        run: |
          versions_file=tomcat${{ matrix.tomcat_major }}.json
          echo "tomcat=$(jq -r '.tomcat_version' $versions_file)" >> $GITHUB_OUTPUT
          echo "tcnative=$(jq -r '.tcnative_version' $versions_file)" >> $GITHUB_OUTPUT
          echo "apr=$(jq -r '.apr_version' $versions_file)" >> $GITHUB_OUTPUT

      - name: Set PR title and target branch
        id: pr
        env:
          OLD_TOMCAT: ${{ steps.current.outputs.tomcat }}
          OLD_TCNATIVE: ${{ steps.current.outputs.tcnative }}
          OLD_APR: ${{ steps.current.outputs.apr }}
          NEW_TOMCAT: ${{ steps.updated.outputs.tomcat }}
          NEW_TCNATIVE: ${{ steps.updated.outputs.tcnative }}
          NEW_APR: ${{ steps.updated.outputs.apr }}
        run: |
          parts=()
          [ "$NEW_TOMCAT" != "$OLD_TOMCAT" ] && parts+=("tomcat to $NEW_TOMCAT")
          [ "$NEW_TCNATIVE" != "$OLD_TCNATIVE" ] && parts+=("tcnative to $NEW_TCNATIVE")
          [ "$NEW_APR" != "$OLD_APR" ] && parts+=("apr to $NEW_APR")

          if [ "$NEW_TOMCAT" != "$OLD_TOMCAT" ]; then
            branch="bump-tomcat-$NEW_TOMCAT"
          else
            branch="bump-tomcat${{ matrix.tomcat_major }}"
            [ "$NEW_TCNATIVE" != "$OLD_TCNATIVE" ] && branch="$branch-tcnative-$NEW_TCNATIVE"
            [ "$NEW_APR" != "$OLD_APR" ] && branch="$branch-apr-$NEW_APR"
          fi

          title="Bump ${parts[0]:-tomcat to $NEW_TOMCAT}"
          for part in "${parts[@]:1}"; do
            title="$title and $part"
          done
          [ "$NEW_TOMCAT" = "$OLD_TOMCAT" ] && title="$title for tomcat ${{ matrix.tomcat_major }}"

          echo "title=$title" >> $GITHUB_OUTPUT
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          branch: ${{ steps.pr.outputs.branch }}
          base: ${{ github.event.repository.default_branch }}
          title: ${{ steps.pr.outputs.title }}
          body: "Freshly served thanks to updatecli and GitHub Actions"
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          team-reviewers: ops-readiness-performance
          author: ${{ vars.BOT_GITHUB_USERNAME }} <${{ vars.BOT_GITHUB_EMAIL }}>
          committer: ${{ vars.BOT_GITHUB_USERNAME }} <${{ vars.BOT_GITHUB_EMAIL }}>
          labels: updatecli
