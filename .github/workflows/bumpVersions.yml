---
name: Bump tomcat versions

on:
  pull_request:
    paths:
      - .github/workflows/bumpVersions.yml
      - updatecli.d/**
      - get-checksum.sh
  workflow_dispatch:
  schedule:
    - cron:  '0 6 * * MON'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  updatecli:
    name: Tomcat ${{ matrix.tomcat_major }} version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - tomcat_major: 11
            tcnative_source_pattern: 2
            apr_source_pattern: 1
          - tomcat_major: 10
            tcnative_source_pattern: 2
            apr_source_pattern: 1
          - tomcat_major: 9
            tcnative_source_pattern: 2
            apr_source_pattern: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.21.3

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049

      - name: Install htmlq
        run: |
          brew install htmlq

      - name: Set required environment variables
        run: |
          echo "TOMCAT_MAJOR=${{ matrix.tomcat_major }}" >> $GITHUB_ENV
          echo "TCNATIVE_SOURCE_PATTERN=${{ matrix.tcnative_source_pattern }}" >> $GITHUB_ENV
          echo "APR_SOURCE_PATTERN=${{ matrix.apr_source_pattern }}" >> $GITHUB_ENV

      - name: Run updatecli
        run: |
          updatecli apply

      - name: Compute PR title and branch from changed versions
        run: |
          FILE="tomcat${TOMCAT_MAJOR}.json"
          OLD=$(git show "HEAD:${FILE}")
          title_parts=()
          branch_parts=()
          for component in tomcat tcnative apr; do
            old_version=$(jq -r ".${component}_version" <<< "$OLD")
            new_version=$(jq -r ".${component}_version" "$FILE")
            if [ "$old_version" != "$new_version" ]; then
              title_parts+=("${component} to ${new_version}")
              branch_parts+=("${component}-${new_version}")
            fi
          done
          if [ ${#title_parts[@]} -eq 0 ]; then
            echo "No version changes detected for Tomcat ${TOMCAT_MAJOR}"
            echo "PR_TITLE=Bump Tomcat ${TOMCAT_MAJOR} dependencies" >> $GITHUB_ENV
            echo "TARGET_BRANCH=bump-tomcat${TOMCAT_MAJOR}" >> $GITHUB_ENV
            exit 0
          fi
          title=$(IFS=,; echo "${title_parts[*]}" | sed 's/,/, /g')
          branch=$(IFS=-; echo "${branch_parts[*]}")
          echo "PR_TITLE=Bump ${title} (Tomcat ${TOMCAT_MAJOR})" >> $GITHUB_ENV
          echo "TARGET_BRANCH=bump-tomcat${TOMCAT_MAJOR}-${branch}" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          branch: ${{ env.TARGET_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          title: ${{ env.PR_TITLE }}
          commit-message: ${{ env.PR_TITLE }}
          body: "Freshly served thanks to updatecli and GitHub Actions"
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          team-reviewers: ops-readiness-performance
          author: ${{ vars.BOT_GITHUB_USERNAME }} <${{ vars.BOT_GITHUB_EMAIL }}>
          committer: ${{ vars.BOT_GITHUB_USERNAME }} <${{ vars.BOT_GITHUB_EMAIL }}>
          labels: updatecli
